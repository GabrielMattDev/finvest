<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finvest — Login</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
<base target="_blank">
</head>
<body>
  <!-- BACKGROUND ANIMATION -->
  <div class="login-bg">
    <!-- Grid lines -->
    <div class="bg-grid"></div>

    <!-- Glow orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Floating bar charts -->
    <svg class="bg-chart" width="180" height="120" viewBox="0 0 180 120">
      <rect x="10" y="60" width="18" height="50" rx="3" fill="#22c55e" opacity="0.4"/>
      <rect x="35" y="40" width="18" height="70" rx="3" fill="#3b82f6" opacity="0.4"/>
      <rect x="60" y="20" width="18" height="90" rx="3" fill="#a855f7" opacity="0.4"/>
      <rect x="85" y="50" width="18" height="60" rx="3" fill="#06b6d4" opacity="0.4"/>
      <rect x="110" y="30" width="18" height="80" rx="3" fill="#f97316" opacity="0.4"/>
      <rect x="135" y="45" width="18" height="65" rx="3" fill="#22c55e" opacity="0.4"/>
      <rect x="160" y="25" width="18" height="85" rx="3" fill="#3b82f6" opacity="0.4"/>
    </svg>

    <svg class="bg-chart" width="160" height="100" viewBox="0 0 160 100">
      <rect x="8" y="50" width="16" height="40" rx="3" fill="#22c55e" opacity="0.35"/>
      <rect x="32" y="30" width="16" height="60" rx="3" fill="#3b82f6" opacity="0.35"/>
      <rect x="56" y="15" width="16" height="75" rx="3" fill="#a855f7" opacity="0.35"/>
      <rect x="80" y="45" width="16" height="45" rx="3" fill="#06b6d4" opacity="0.35"/>
      <rect x="104" y="25" width="16" height="65" rx="3" fill="#f97316" opacity="0.35"/>
      <rect x="128" y="35" width="16" height="55" rx="3" fill="#22c55e" opacity="0.35"/>
    </svg>

    <svg class="bg-chart" width="200" height="140" viewBox="0 0 200 140">
      <rect x="12" y="70" width="20" height="60" rx="3" fill="#22c55e" opacity="0.3"/>
      <rect x="40" y="45" width="20" height="85" rx="3" fill="#3b82f6" opacity="0.3"/>
      <rect x="68" y="25" width="20" height="105" rx="3" fill="#a855f7" opacity="0.3"/>
      <rect x="96" y="55" width="20" height="75" rx="3" fill="#06b6d4" opacity="0.3"/>
      <rect x="124" y="35" width="20" height="95" rx="3" fill="#f97316" opacity="0.3"/>
      <rect x="152" y="50" width="20" height="80" rx="3" fill="#22c55e" opacity="0.3"/>
    </svg>

    <svg class="bg-chart" width="140" height="90" viewBox="0 0 140 90">
      <rect x="6" y="40" width="14" height="44" rx="3" fill="#22c55e" opacity="0.45"/>
      <rect x="26" y="25" width="14" height="59" rx="3" fill="#3b82f6" opacity="0.45"/>
      <rect x="46" y="10" width="14" height="74" rx="3" fill="#a855f7" opacity="0.45"/>
      <rect x="66" y="35" width="14" height="49" rx="3" fill="#06b6d4" opacity="0.45"/>
      <rect x="86" y="20" width="14" height="64" rx="3" fill="#f97316" opacity="0.45"/>
      <rect x="106" y="30" width="14" height="54" rx="3" fill="#22c55e" opacity="0.45"/>
    </svg>

    <svg class="bg-chart" width="170" height="110" viewBox="0 0 170 110">
      <rect x="10" y="55" width="16" height="45" rx="3" fill="#22c55e" opacity="0.38"/>
      <rect x="34" y="35" width="16" height="65" rx="3" fill="#3b82f6" opacity="0.38"/>
      <rect x="58" y="20" width="16" height="80" rx="3" fill="#a855f7" opacity="0.38"/>
      <rect x="82" y="50" width="16" height="50" rx="3" fill="#06b6d4" opacity="0.38"/>
      <rect x="106" y="30" width="16" height="70" rx="3" fill="#f97316" opacity="0.38"/>
      <rect x="130" y="40" width="16" height="60" rx="3" fill="#22c55e" opacity="0.38"/>
    </svg>

    <svg class="bg-chart" width="190" height="130" viewBox="0 0 190 130">
      <rect x="10" y="65" width="18" height="55" rx="3" fill="#22c55e" opacity="0.32"/>
      <rect x="36" y="40" width="18" height="80" rx="3" fill="#3b82f6" opacity="0.32"/>
      <rect x="62" y="20" width="18" height="100" rx="3" fill="#a855f7" opacity="0.32"/>
      <rect x="88" y="55" width="18" height="65" rx="3" fill="#06b6d4" opacity="0.32"/>
      <rect x="114" y="35" width="18" height="85" rx="3" fill="#f97316" opacity="0.32"/>
      <rect x="140" y="50" width="18" height="70" rx="3" fill="#22c55e" opacity="0.32"/>
    </svg>

    <svg class="bg-chart" width="150" height="100" viewBox="0 0 150 100">
      <rect x="8" y="45" width="15" height="47" rx="3" fill="#22c55e" opacity="0.4"/>
      <rect x="30" y="30" width="15" height="62" rx="3" fill="#3b82f6" opacity="0.4"/>
      <rect x="52" y="15" width="15" height="77" rx="3" fill="#a855f7" opacity="0.4"/>
      <rect x="74" y="40" width="15" height="52" rx="3" fill="#06b6d4" opacity="0.4"/>
      <rect x="96" y="25" width="15" height="67" rx="3" fill="#f97316" opacity="0.4"/>
      <rect x="118" y="35" width="15" height="57" rx="3" fill="#22c55e" opacity="0.4"/>
    </svg>

    <svg class="bg-chart" width="160" height="110" viewBox="0 0 160 110">
      <rect x="8" y="50" width="16" height="52" rx="3" fill="#22c55e" opacity="0.36"/>
      <rect x="32" y="30" width="16" height="72" rx="3" fill="#3b82f6" opacity="0.36"/>
      <rect x="56" y="15" width="16" height="87" rx="3" fill="#a855f7" opacity="0.36"/>
      <rect x="80" y="45" width="16" height="57" rx="3" fill="#06b6d4" opacity="0.36"/>
      <rect x="104" y="25" width="16" height="77" rx="3" fill="#f97316" opacity="0.36"/>
      <rect x="128" y="35" width="16" height="67" rx="3" fill="#22c55e" opacity="0.36"/>
    </svg>

    <!-- Floating line charts -->
    <svg class="bg-chart" width="220" height="80" viewBox="0 0 220 80">
      <polyline points="0,60 30,45 60,50 90,30 120,35 150,15 180,20 210,5 220,10" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.3"/>
      <polyline points="0,70 30,55 60,60 90,40 120,45 150,25 180,30 210,15 220,20" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.25"/>
    </svg>

    <svg class="bg-chart" width="200" height="70" viewBox="0 0 200 70">
      <polyline points="0,50 25,35 50,40 75,20 100,25 125,10 150,15 175,5 200,8" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.3"/>
    </svg>

    <!-- Floating metrics cards -->
    <div class="bg-metric">
      <div class="bm-label">patrimônio total</div>
      <div class="bm-value">R$ 142.850</div>
      <div class="bm-change" style="color:#22c55e;">+12,4%</div>
    </div>
    <div class="bg-metric">
      <div class="bm-label">receitas</div>
      <div class="bm-value">R$ 8.420</div>
      <div class="bm-change" style="color:#22c55e;">+5,2%</div>
    </div>
    <div class="bg-metric">
      <div class="bm-label">despesas</div>
      <div class="bm-value">R$ 3.180</div>
      <div class="bm-change" style="color:#ef4444;">-8,1%</div>
    </div>
    <div class="bg-metric">
      <div class="bm-label">investimentos</div>
      <div class="bm-value">R$ 38.200</div>
      <div class="bm-change" style="color:#22c55e;">+R$ 1.240</div>
    </div>
    <div class="bg-metric">
      <div class="bm-label">cdi anual</div>
      <div class="bm-value">10,75%</div>
      <div class="bm-change" style="color:#3b82f6;">estável</div>
    </div>
    <div class="bg-metric">
      <div class="bm-label">ibovespa</div>
      <div class="bm-value">135.420</div>
      <div class="bm-change" style="color:#22c55e;">+1,8%</div>
    </div>
    <div class="bg-metric">
      <div class="bm-label">dólar</div>
      <div class="bm-value">R$ 5,02</div>
      <div class="bm-change" style="color:#22c55e;">-0,3%</div>
    </div>

    <!-- Bottom line chart -->
    <svg class="bg-line-chart" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0,150 Q100,120 200,130 T400,100 T600,80 T800,60 T1000,40 T1200,20 L1200,200 L0,200 Z" fill="url(#bgGrad)"/>
      <path d="M0,150 Q100,120 200,130 T400,100 T600,80 T800,60 T1000,40 T1200,20" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.2"/>
      <path d="M0,170 Q150,140 300,150 T600,110 T900,70 T1200,30" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.15"/>
      <path d="M0,180 Q200,160 400,165 T800,120 T1200,50" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.15"/>
    </svg>
  </div>

  <!-- LOGIN CARD -->
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <img src="assets/logo.png" alt="Finvest" class="login-logo">
        <h1>Finvest</h1>
        <p>Gestão Financeira e Investimentos</p>
      </div>

      <form id="login-form" class="login-form" onsubmit="return handleLogin(event)">
        <div class="field-group">
          <label for="username">Login</label>
          <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username">
        </div>
        <div class="field-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password">
        </div>
        <div class="login-error" id="login-error">Login ou Senha Incorretos</div>
        <button type="submit" class="login-btn">Entrar</button>
      </form>

      <div class="login-footer">
        <span>v1.0.0 — Finvest</span>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
