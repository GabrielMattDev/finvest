<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finvest — Administração</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/adm.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.png" alt="Finvest" class="sidebar-logo">
        <span class="sidebar-title">finvest</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="user-avatar" id="user-avatar">A</div>
          <div>
            <div class="user-name" id="user-name">admin</div>
            <div class="user-profile" id="user-profile">admin</div>
          </div>
        </div>
        <button class="logout-btn" onclick="FINVEST.logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9"/><path d="M16 17L21 12L16 7"/><path d="M21 12H9"/></svg>
          sair
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12H21M3 6H21M3 18H21"/></svg>
        </button>
        <h2 class="page-title">administração</h2>
        <div class="topbar-actions">
          <span class="topbar-date" id="current-date"></span>
        </div>
      </header>

      <div id="admin-guard" style="display:none;">
        <div class="guard-box">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--fn-red)" stroke-width="1.5"><path d="M12 2L2 7L12 12L22 7L12 2Z"/><path d="M2 17L12 22L22 17"/><path d="M2 12L12 17L22 12"/></svg>
          <h3>acesso restrito</h3>
          <p>este módulo é exclusivo para administradores.</p>
          <button class="btn-primary" onclick="window.location.href='fin.html'" style="margin-top:16px;">voltar ao dashboard</button>
        </div>
      </div>

      <div id="admin-content">
        <div class="kpi-grid" style="grid-template-columns: repeat(4, 1fr);">
          <div class="kpi-card">
            <div class="kpi-label">total de usuários</div>
            <div class="kpi-value" id="stat-total-users">0</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">administradores</div>
            <div class="kpi-value" id="stat-admins">0</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">analistas</div>
            <div class="kpi-value" id="stat-analistas">0</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">usuários</div>
            <div class="kpi-value" id="stat-usuarios">0</div>
          </div>
        </div>

        <div class="adm-actions">
          <button class="btn-primary" onclick="openModal('add')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5V19M5 12H19"/></svg>
            novo usuário
          </button>
        </div>

        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">usuários do sistema</span>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="users-table">
              <thead>
                <tr><th>usuário</th><th>nome</th><th>perfil</th><th>módulos liberados</th><th>ações</th></tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="user-modal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">novo usuário</h3>
        <button class="modal-close" onclick="closeModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6L18 18"/></svg>
        </button>
      </div>
      <form id="user-form" onsubmit="return saveUser(event)">
        <input type="hidden" id="edit-username">
        <div class="field-group">
          <label>usuário</label>
          <input type="text" id="new-username" placeholder="ex: joao.silva" required>
        </div>
        <div class="field-group">
          <label>nome completo</label>
          <input type="text" id="new-name" placeholder="ex: João Silva" required>
        </div>
        <div class="field-group">
          <label>senha</label>
          <input type="password" id="new-password" placeholder="mínimo 4 caracteres" required>
        </div>
        <div class="field-group">
          <label>perfil base</label>
          <select id="new-profile" required onchange="onProfileChange()">
            <option value="usuario">usuário — gestão financeira</option>
            <option value="analista">analista — gestão financeira + notícias</option>
            <option value="admin">admin — acesso total</option>
          </select>
        </div>
        <div class="field-group">
          <label>módulos de acesso</label>
          <div class="modules-check" id="modules-check">
            <label class="check-row"><input type="checkbox" value="FIN" checked> <span>gestão financeira (FIN)</span></label>
            <label class="check-row"><input type="checkbox" value="NEW"> <span>notícias (NEW)</span></label>
            <label class="check-row"><input type="checkbox" value="INV"> <span>investimentos (INV)</span></label>
            <label class="check-row"><input type="checkbox" value="ADM"> <span>administração (ADM)</span></label>
          </div>
        </div>
        <div class="modal-preview" id="modal-preview">
          <span class="preview-label">módulos liberados:</span>
          <span class="preview-modules" id="preview-modules">gestão financeira</span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">cancelar</button>
          <button type="submit" class="btn-primary">salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/adm.js"></script>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
</body>
</html>
